name: CI

# check: gofmt, vet, staticcheck, unit tests with workflows-stack's vendored protocol vectors
# (testdata/vectors), and no runtime dependencies.
# conformance: workflows-stack's conformance harness against conformance/ (push and pull).
# e2e: this SDK against the real workflows-stack at .workflows-stack-rev.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Both supported Go releases: go.mod declares the older one.
  check:
    name: check (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - if: matrix.go == '1.27.x'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - run: go build ./...
      - run: go test -race ./...
      - name: no runtime dependencies
        run: test "$(go list -m all | wc -l)" -eq 1

  # workflows-stack's conformance harness (cmd/workflows-conformance, protocol/conformance) against
  # conformance/ (the push handler, and the same workflows as a pull worker), at the
  # workflows-stack commit in .workflows-stack-rev. workflows-stack is internal: the job reads it
  # with the WORKFLOWS_STACK_DEPLOY_KEY secret (a read-only deploy key on workflows-stack), and
  # fails on a push to main when the secret is missing (so a deleted key can't turn main silently
  # green). Pull requests without it (forks get no secrets) skip with a notice.
  conformance:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: token
        env:
          TOKEN: ${{ secrets.WORKFLOWS_STACK_DEPLOY_KEY }}
        run: |
          if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "::error title=conformance can't run::WORKFLOWS_STACK_DEPLOY_KEY isn't set, so this job can't read ezgamehost/workflows-stack. On main that's a failure, not a skip: restore the deploy key."; exit 1
          else echo "::notice title=conformance skipped::WORKFLOWS_STACK_DEPLOY_KEY isn't available to this pull request; the conformance harness didn't run."; fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: steps.token.outputs.present == 'true'
        id: rev
        run: echo "sha=$(cat .workflows-stack-rev)" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          repository: ezgamehost/workflows-stack
          ref: ${{ steps.rev.outputs.sha }}
          ssh-key: ${{ secrets.WORKFLOWS_STACK_DEPLOY_KEY }}
          path: .workflows-stack
          persist-credentials: false
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: .workflows-stack/go.mod
          cache-dependency-path: .workflows-stack/go.sum
      - if: steps.token.outputs.present == 'true'
        name: vendored vectors match workflows-stack
        run: diff -r --exclude SOURCE --exclude README.md .workflows-stack/protocol/vectors testdata/vectors
      - if: steps.token.outputs.present == 'true'
        run: scripts/conformance.sh .workflows-stack

  # End to end: this SDK against the real workflows-stack at .workflows-stack-rev (`workflows-stack
  # all`: api, live, engine, dispatch), on Postgres, Redis and an S3 fixture, with org-api faked by
  # workflows-conformance fake-org-api (scripts/e2e.sh). Same secret, failure and skip rules as
  # conformance.
  e2e:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379
      B2_ENDPOINT: http://127.0.0.1:9000
      B2_REGION: us-east-1
      B2_BUCKET: workflows-e2e
      B2_KEY_ID: workflowstestkey
      B2_APPLICATION_KEY: workflowstestsecret
    steps:
      - id: token
        env:
          TOKEN: ${{ secrets.WORKFLOWS_STACK_DEPLOY_KEY }}
        run: |
          if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "::error title=e2e can't run::WORKFLOWS_STACK_DEPLOY_KEY isn't set, so this job can't read ezgamehost/workflows-stack. On main that's a failure, not a skip: restore the deploy key."; exit 1
          else echo "::notice title=e2e skipped::WORKFLOWS_STACK_DEPLOY_KEY isn't available to this pull request; the end-to-end tests didn't run."; fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: steps.token.outputs.present == 'true'
        id: rev
        run: echo "sha=$(cat .workflows-stack-rev)" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          repository: ezgamehost/workflows-stack
          ref: ${{ steps.rev.outputs.sha }}
          ssh-key: ${{ secrets.WORKFLOWS_STACK_DEPLOY_KEY }}
          path: .workflows-stack
          persist-credentials: false
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: .workflows-stack/go.mod
          cache-dependency-path: .workflows-stack/go.sum
      - if: steps.token.outputs.present == 'true'
        name: S3 fixture (workflows-stack's SeaweedFS image)
        run: |
          source .workflows-stack/internal/store/testdata/seaweedfs.sh
          docker run -d --name workflows-s3 -p 9000:9000 \
            -e AWS_ACCESS_KEY_ID=workflowstestkey -e AWS_SECRET_ACCESS_KEY=workflowstestsecret \
            "$S3_FIXTURE_IMAGE" "${S3_FIXTURE_ARGS[@]}"
          for i in $(seq 1 60); do curl -fsS "$B2_ENDPOINT/healthz" && break; sleep 1; done
          curl -fsS "$B2_ENDPOINT/healthz"
      - if: steps.token.outputs.present == 'true'
        run: scripts/e2e.sh .workflows-stack
      - if: failure() && steps.token.outputs.present == 'true'
        name: stack and worker logs
        run: tail -n 500 .bin/stack.log || true; tail -n 100 .bin/worker.log || true
